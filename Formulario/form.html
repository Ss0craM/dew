<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passei?</title>

    <script src="./form.js" defer></script>
</head>

<body>
    <h1>Calculadora de média acadêmica!</h1>


    <form action="" id="formularioAcademico">
        <h2>Formulário</h2>

        <div>
            <label for="nome">Digite seu nome</label>


            <input type="text" id="nome" name="nome" placeholder="Digite o seu nome!" required />
        </div>

        <div>
            <label for="notaUM">Digite a primeira nota</label>
            <input type="number" id="notaUm" name="notaum" min="0" max="10" step="0.1" placeholder="8.9" required />
        </div>


        <div>
            <label for="notaDois">Digite a segunda nota</label>
            <input type="number" id="notaDois" name="notaDois" min="0" max="10" step="0.1" placeholder="8.9" required />
        </div>


        <div>
            <button type="submit" id="btnCalular">Calcular média</button>
            <button type="reset" id="btnLimparcampos">Limpar campos</button>
        </div>


        <div>
            <p id="resultados">..</p>
        </div>
    </form>
</body>

</html>
